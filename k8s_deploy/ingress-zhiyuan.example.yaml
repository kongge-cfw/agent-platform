# 二级目录 /zhiyuan：与其它系统共用 Ingress 入口时使用本文件，不要和
# ingress.example.yaml（path: /）同时挂到同一个 host。
#
# 应用仍监听 / 与 /api。Ingress 剥掉 /zhiyuan。
# 必填：ConfigMap APP_ROOT_PATH=/zhiyuan（推荐 kubectl apply -k k8s_zhiyuan）。
# configuration-snippet 在 ingress-nginx 1.9+ 默认可能被拒绝，只能当附加 Header，不能当唯一前缀来源。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nanzi-ai-agent-zhiyuan
  namespace: nanzi-ai-agent
  labels:
    app.kubernetes.io/name: nanzi-ai-agent
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "nanzi_route"
    nginx.ingress.kubernetes.io/session-cookie-path: "/zhiyuan"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Prefix /zhiyuan;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nanzi.example.com
      secretName: nanzi-ai-agent-tls
  rules:
    - host: nanzi.example.com
      http:
        paths:
          - path: /zhiyuan(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nanzi-ai-agent
                port:
                  name: http
