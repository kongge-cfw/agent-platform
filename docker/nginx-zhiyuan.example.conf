# 南孜智能体平台 — 一级根路径 / 二级目录 Nginx 反代示例
#
# 应用本身仍监听 / 与 /api（与 docker-ops 相同）。
# 公网只开一个 IP:端口、和其它系统共用 Host 时，必须用外部 Nginx（本文件）
# 把 /zhiyuan 转到 8001，并剥掉前缀。
#
# 本机 ./dev.sh 直连 http://localhost:8001/zhiyuan 不需要 Nginx；
# 应用会自己剥前缀。不要把这份配置理解成本机 8001 的前置条件。
#
# 用法：
#   1. 本服务对内网暴露 127.0.0.1:8001
#   2. 将本文件 include 进站点 server{}，或按需合并
#   3. 进程必须设置 APP_ROOT_PATH=/zhiyuan（MCP issuer / 调度 / OpenAPI 都读它）
#   4. 下面的 X-Forwarded-Prefix 仍要带，供当前请求注入 SPA/Cookie
#
# 一级目录（独占该端口）不需要本文件，直接 proxy_pass 到 8001 即可。
#
# 若可以改 http {}，推荐改用 map（比 location 内 if 更干净）：
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
# 然后把下面的 set/if 换成：proxy_set_header Connection $connection_upgrade;

# 仅当本服务独占 Origin 根路径的 well-known 时，才取消下面注释。
# 与其它系统共用同一 Host 时不要开启，以免抢走对方的 OAuth 发现。
# location = /.well-known/oauth-authorization-server {
#     return 302 /zhiyuan/.well-known/oauth-authorization-server;
# }
# location = /.well-known/oauth-protected-resource {
#     return 302 /zhiyuan/.well-known/oauth-protected-resource;
# }

# 无尾斜杠时补上，避免 /zhiyuan 打到别的业务
location = /zhiyuan {
    return 301 /zhiyuan/;
}

location /zhiyuan/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    # $http_host 带端口；公网 IP:端口访问时 $host 会丢掉端口，iframe Origin 对不上。
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix /zhiyuan;
    proxy_set_header Upgrade $http_upgrade;
    # 普通 HTTP 请求不要写死 Connection: upgrade，否则 keep-alive 会被拆掉
    set $nanzi_connection_upgrade "";
    if ($http_upgrade) {
        set $nanzi_connection_upgrade "upgrade";
    }
    proxy_set_header Connection $nanzi_connection_upgrade;
    # 对话是 SSE 长连接。下面两个 timeout 是「上游连续无数据」的空闲上限，
    # 不是整段对话的总时长；有 token/工具事件进来就会重置。
    # 默认 Nginx 是 60s，工具一卡住就会 504。3600s 与 Ingress 示例一致。
    # 若前面还有 SLB/CDN，也要把那边的空闲超时调到同级，否则仍会在外层被掐。
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    gzip off;
    client_max_body_size 25m;
}
