version: '3.8'

services:
  ai-agent:
    image: ${NANZI_IMAGE:-nanzi-ai-agent:latest}
    container_name: nanzi-ai-agent
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${NANZI_ENV_FILE:-.env}
    environment:
      - APP_ENV=${APP_ENV:-prod}
      - HOST_DATA_DIR=${HOST_DATA_DIR:-}
    volumes:
      # 如需 Oracle Thick 模式，取消下一行并改为宿主机 Instant Client 路径
      # - /opt/oracle/instantclient:/opt/oracle/instantclient
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ~/.agents/skills:/app/data/skills
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
